<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0c02">
<title>Bayonas VitalGym</title>

<link rel="icon" type="image/png" href="./icono.png">
<link rel="apple-touch-icon" href="./icono.png">
<link rel="manifest" href="manifest.json">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
  :root {
    --font-base: clamp(16px, 4vw, 20px);
    --font-title: clamp(20px, 5.5vw, 26px);
    --font-timer: clamp(32px, 8vw, 44px);
  }

  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background-color: #0d0602;
    background-image: linear-gradient(rgba(10, 5, 1, 0.90), rgba(20, 10, 2, 0.96)), url('./icono.png');
    background-repeat: repeat-y;
    background-position: top center;
    background-size: 100% auto;
    color: #f8fafc; 
    margin: 0; 
    padding: 12px; 
    padding-bottom: 50px; 
    font-size: var(--font-base);
  }

  .btn-fullscreen { 
    position: fixed; 
    top: 8px; 
    left: 8px; 
    background: transparent; 
    color: rgba(255, 255, 255, 0.15); 
    border: none; 
    width: 35px; 
    height: 35px; 
    font-size: 18px; 
    cursor: pointer; 
    z-index: 99; 
  }

  /* LOGO Y BOTONES CABECERA */
  .logo-container {
    width: 100%;
    aspect-ratio: 1 / 0.85;
    margin-top: 6px;
    margin-bottom: 12px;
    border-radius: 16px;
    border: 2px solid #fd5e09;
    box-shadow: 0 4px 20px rgba(253, 94, 9, 0.4);
    overflow: hidden;
    background-color: #050201;
    position: relative;
    box-sizing: border-box;
  }

  .logo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center top;
    display: block;
  }

  .header-actions-left {
    position: absolute;
    top: 10px;
    left: 10px;
    z-index: 2;
  }

  .header-actions-right {
    position: absolute;
    top: 10px;
    right: 10px;
    z-index: 2;
  }

  /* REPRODUCTOR SUPERIOR FIJO */
  .sticky-player {
    background: linear-gradient(145deg, #1f0f04, #0d0602);
    border: 2px solid #fd5e09;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(253, 94, 9, 0.3);
  }

  .player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fd5e09;
    font-weight: bold;
    font-size: var(--font-base);
    margin-bottom: 8px;
  }

  .player-controls {
    display: grid;
    grid-template-columns: repeat(3, 1fr) 1.2fr 1.2fr;
    gap: 6px;
    margin-bottom: 8px;
  }

  .player-btn {
    background: #1f0f04;
    color: #fd5e09;
    border: 1px solid #7c2d12;
    padding: 8px 4px;
    border-radius: 8px;
    font-weight: bold;
    font-size: calc(var(--font-base) * 0.85);
    text-align: center;
    cursor: pointer;
  }

  .card { 
    background: linear-gradient(145deg, rgba(31, 15, 4, 0.95), rgba(13, 6, 2, 0.95)); 
    padding: 14px; 
    border-radius: 14px; 
    margin-bottom: 14px; 
    border: 2px solid #fd5e09; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.8);
    scroll-margin-top: 140px;
  }

  .ex-title {
    font-size: var(--font-title);
    color: #fd5e09;
    font-weight: bold;
    text-shadow: 1px 1px 2px #000;
  }

  .ex-subtitle {
    font-size: calc(var(--font-base) * 0.9);
    color: #f59e0b;
    font-weight: 700;
  }

  .timer-box {
    background: #050201;
    border: 2px solid #7c2d12;
    border-radius: 12px;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 10px 0;
  }

  .timer-digits {
    font-size: var(--font-timer);
    font-weight: bold;
    color: #22c55e;
    font-family: monospace;
  }

  .video-container {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    margin: 10px 0;
    border: 1px solid #7c2d12;
  }

  .video-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  label { 
    font-size: calc(var(--font-base) * 0.8); 
    color: #f97316; 
    display: block; 
    margin-bottom: 4px; 
    font-weight: 800; 
    text-transform: uppercase; 
  }

  select, input { 
    background-color: #050201; 
    color: #fff; 
    border: 1.5px solid #7c2d12; 
    padding: 10px; 
    border-radius: 8px; 
    width: 100%; 
    box-sizing: border-box; 
    font-size: var(--font-base); 
    font-weight: 700; 
  }

  .grid-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 8px;
  }

  .counter { 
    display: flex; 
    align-items: center; 
    background-color: #050201; 
    border-radius: 8px; 
    border: 1.5px solid #7c2d12; 
  }

  .counter button { 
    width: 44px; 
    height: 44px; 
    background: #1f0f04; 
    color: #fd5e09; 
    border: none; 
    font-size: calc(var(--font-base) * 1.2); 
    font-weight: bold; 
    cursor: pointer; 
  }

  .counter input { 
    border: none; 
    text-align: center; 
    color: #fd5e09; 
    font-size: var(--font-base); 
  }

  .btn { 
    background: linear-gradient(135deg, #ea580c, #7c2d12); 
    color: white; 
    border: 2px solid #fd5e09; 
    padding: 14px; 
    border-radius: 12px; 
    font-weight: bold; 
    width: 100%; 
    cursor: pointer; 
    font-size: var(--font-base); 
  }

  .btn-green {
    background: linear-gradient(135deg, #15803d, #14532d);
    color: #fff;
    border: 1px solid #22c55e;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    font-size: var(--font-base);
    cursor: pointer;
  }

  .btn-save { background: linear-gradient(135deg, #15803d, #14532d); border-color: #22c55e; }
  .btn-exit { background: linear-gradient(135deg, #b91c1c, #7f1d1d); border-color: #f87171; }
  .btn-video-load { background: linear-gradient(135deg, #0284c7, #0369a1); border-color: #38bdf8; color: white; padding: 6px 12px; border-radius: 8px; font-size: calc(var(--font-base)*0.75); font-weight: bold; cursor: pointer; display: inline-block; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 100; padding: 16px; align-items: center; justify-content: center; }
  .modal-content { background: #0c0401; border: 2px solid #fd5e09; border-radius: 18px; padding: 20px; max-width: 650px; width: 100%; max-height: 88vh; overflow-y: auto; box-sizing: border-box; }
  .tab-btn { background: #050201; border: 1.5px solid #7c2d12; color: #a1a1aa; padding: 10px; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; font-size: calc(var(--font-base) * 0.8); }
  .tab-btn.active { background: #fd5e09; color: white; border-color: #ea580c; }
  
  .footer-lema { text-align: center; color: #fd5e09; font-weight: bold; font-size: calc(var(--font-base) * 0.85); margin-top: 25px; text-transform: uppercase; letter-spacing: 2px; }
</style>
</head>
<body>

<button class="btn-fullscreen" id="btnFullscreenBtn" title="Maximizar">⛶</button>

<div class="logo-container">
  <img src="./icono.png" class="logo-img" alt="Bayonas VitalGym">
  <div class="header-actions-left">
    <label class="btn-video-load">
      📹 Cargar Vídeos
      <input type="file" id="videoFolderInput" webkitdirectory directory multiple style="display:none">
    </label>
  </div>
  <div class="header-actions-right">
    <button class="btn btn-exit" id="btnExitBtn" style="width:auto; padding:6px 12px; font-size:calc(var(--font-base)*0.75);">🚪 Salir</button>
  </div>
</div>

<div class="sticky-player">
  <div class="player-header">
    <span>🎵 Reproductor</span>
  </div>
  <div class="player-controls">
    <button class="player-btn">⏮</button>
    <button class="player-btn">▶ Play</button>
    <button class="player-btn">⏭</button>
    <button class="player-btn">📁 CARPETA</button>
    <button class="player-btn">🔗 Enlace</button>
  </div>
  <div style="display:flex; align-items:center; gap:8px;">
    <span style="font-size:calc(var(--font-base)*0.8); color:#f97316; font-weight:bold;">Volumen:</span>
    <input type="range" style="flex:1; accent-color:#fd5e09;">
  </div>
</div>

<div class="card">
  <div style="display: flex; gap: 10px;">
    <div style="flex: 1;">
      <label>Fecha de Hoy</label>
      <input type="date" id="sessionDate">
    </div>
    <div style="flex: 1.4;">
      <label>Rutina de Entreno</label>
      <select id="daySelect">
        <option value="">-- Seleccionar Día --</option>
        <option value="1">DÍA 1 - Pecho, Espalda, Hombro, Bici</option>
        <option value="2">DÍA 2 - Pierna, Brazos, Core, Bici</option>
      </select>
    </div>
  </div>
</div>

<div id="exercisesContainer">
  <p style="text-align:center; color:#a1a1aa; padding: 24px;">👆 Selecciona un día en <strong>Rutina de Entreno</strong> para cargar tus ejercicios.</p>
</div>

<div style="display: flex; gap: 10px; margin-top: 18px;">
  <button class="btn btn-save" id="btnSaveBtn" style="flex: 1.5;">💾 Guardar Sesión</button>
  <button class="btn" id="btnHistoryBtn" style="flex: 1;">📊 Historial / Progreso</button>
</div>

<div class="footer-lema">ENTRENA • MEJORA • EVOLUCIONA</div>

<div id="historyModal" class="modal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h2 style="margin:0; font-size:var(--font-title); color:#fd5e09;">📊 Historial y Progreso</h2>
      <button id="btnCloseModal" style="background:none; border:none; color:#ea580c; font-size:24px; cursor:pointer;">✕</button>
    </div>

    <div style="display: flex; gap: 6px; margin-bottom: 16px;">
      <button id="tabSessions" class="tab-btn active">📅 Sesiones</button>
      <button id="tabExercise" class="tab-btn">📈 Ejercicio</button>
      <button id="tabGlobal" class="tab-btn">📊 Volumen Global</button>
    </div>

    <div id="viewSessions">
      <div id="historyList"></div>
    </div>

    <div id="viewExercise" style="display: none;">
      <div style="margin-bottom: 14px;">
        <label>Selecciona Ejercicio:</label>
        <select id="exerciseCompareSelect"></select>
      </div>
      <div id="exerciseAnalysisContent"></div>
    </div>

    <div id="viewGlobal" style="display: none;">
      <div id="globalAnalysisContent"></div>
    </div>

    <div style="margin-top: 18px; border-top: 1px solid #7c2d12; padding-top: 14px; text-align: right;">
      <button class="btn btn-save" id="btnExportCSV" style="width: auto; padding: 10px 18px; font-size: calc(var(--font-base)*0.85);">⬇️ Exportar CSV</button>
    </div>
  </div>
</div>

<script>
var baseRoutines = {
  "1": [
    { id: "d1_bike1", name: "Bici Elíptica (Calentamiento)", target: "5 minutos (300s)", isBike: true },
    { id: "d1_e1", name: "1. Press inclinado en palancas", target: "4 series x 10-12 rep. (90-120s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 4 },
    { id: "d1_e2", name: "2. Jalón neutro en palancas", target: "4 series x 10-12 rep. (90-120s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 4 },
    { id: "d1_e3", name: "3. Press de hombro máquina palancas", target: "3 series x 10-12 rep. (90s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 3 },
    { id: "d1_e4", name: "4. Aperturas en palancas", target: "3 series x 12-15 rep. (90s)", defaultWeight: 0, defaultReps: "12-15", totalSeries: 3 },
    { id: "d1_e5", name: "5. Remo en punta o Multipower", target: "3 series x 10-12 rep. (90s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 3 },
    { id: "d1_e6", name: "6. Elevaciones máquina disco laterales", target: "3 series x 12-15 rep. (90s)", defaultWeight: 0, defaultReps: "12-15", totalSeries: 3 },
    { id: "d1_bike2", name: "Bici Elíptica (Vuelta a la calma)", target: "Opcional (5-30 min)", isBikeOptional: true }
  ],
  "2": [
    { id: "d2_bike1", name: "Bici Elíptica (Calentamiento)", target: "5 minutos (300s)", isBike: true },
    { id: "d2_e1", name: "1. Prensa inclinada - Cuádriceps", target: "4 series x 10-12 rep. (120s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 4 },
    { id: "d2_e2", name: "2. Femoral sentado", target: "4 series x 10-12 rep. (90s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 4 },
    { id: "d2_e3", name: "3. Fondos en máquina de placas", target: "3 series x 10-12 rep. (90s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 3 },
    { id: "d2_e4", name: "4. Curl de bíceps", target: "3 series x 10-12 rep. (90s)", defaultWeight: 0, defaultReps: "10-12", totalSeries: 3 },
    { id: "d2_e5", name: "5. Extensión de tríceps agarre ancho", target: "3 series x 12-15 rep. (90s)", defaultWeight: 0, defaultReps: "12-15", totalSeries: 3 },
    { id: "d2_e6", name: "6. Abdominal inferior / superior", target: "3 series x 15-20 rep. (60s)", defaultWeight: 0, defaultReps: "15-20", totalSeries: 3 },
    { id: "d2_bike2", name: "Bici Elíptica (Vuelta a la calma)", target: "Opcional (5-30 min)", isBikeOptional: true }
  ]
};

var localVideos = {};
var appData = { history: [] };
try {
  var saved = localStorage.getItem('gym_routine_pro_data');
  if (saved) {
    var parsed = JSON.parse(saved);
    if (parsed) appData = parsed;
  }
  if (!appData.history) appData.history = [];
} catch(e){}

var currentSeries = {};
var timerIntervals = {};
var timerSeconds = {};

function setTodayDate() {
  var dateInput = document.getElementById('sessionDate');
  if (dateInput) {
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1);
    if (mm.length < 2) mm = '0' + mm;
    var dd = String(today.getDate());
    if (dd.length < 2) dd = '0' + dd;
    dateInput.value = yyyy + '-' + mm + '-' + dd;
  }
}

function renderExercises() {
  var daySelect = document.getElementById('daySelect');
  if (!daySelect) return;
  var currentDay = daySelect.value;
  var container = document.getElementById('exercisesContainer');
  container.innerHTML = '';
  
  if (!currentDay || !baseRoutines[currentDay]) {
    container.innerHTML = '<p style="text-align:center; color:#a1a1aa; padding: 24px;">👆 Selecciona un día en <strong>Rutina de Entreno</strong> para cargar tus ejercicios.</p>';
    return;
  }
  
  var exercises = baseRoutines[currentDay];
  var lastSession = { data: {} };
  for (var i = appData.history.length - 1; i >= 0; i--) {
    if (String(appData.history[i].day) === String(currentDay)) {
      lastSession = appData.history[i];
      break;
    }
  }

  for (var j = 0; j < exercises.length; j++) {
    var ex = exercises[j];
    if (!currentSeries[ex.id]) currentSeries[ex.id] = 1;
    var exData = (lastSession.data && lastSession.data[ex.id]) ? lastSession.data[ex.id] : { weight: ex.defaultWeight || 0, reps: ex.defaultReps || "", notes: '' };

    var card = document.createElement('div');
    card.className = "card";
    card.id = "card_" + ex.id;
    
    var html = '<div style="display:flex; justify-content:space-between; align-items:flex-start;"><div>';
    html += '<div class="ex-title">' + ex.name + '</div>';
    html += '<div class="ex-subtitle">' + ex.target + '</div>';
    html += '</div>';
    
    if (!ex.isBike && !ex.isBikeOptional) {
      if (localVideos[ex.id]) {
        html += '<button id="btn_vid_' + ex.id + '" class="btn-green" style="padding:4px 10px; font-size:0.8rem;" onclick="toggleVideo(\'' + ex.id + '\')">▶ Vídeo</button>';
      }
    }
    html += '</div>';

    if (!ex.isBike && !ex.isBikeOptional) {
      html += '<div style="margin-top:8px;">';
      html += '<button id="btn_start_' + ex.id + '" class="btn-green" style="width:100%;" onclick="startSerie(\'' + ex.id + '\', ' + ex.totalSeries + ')">⏱ Iniciar Serie ' + currentSeries[ex.id] + '/' + ex.totalSeries + '</button>';
      html += '</div>';

      html += '<div id="timer_box_' + ex.id + '" class="timer-box" style="display:none;">';
      html += '<div><div id="timer_label_' + ex.id + '" style="font-size:0.75rem; color:#a1a1aa; font-weight:bold;">SERIE ' + currentSeries[ex.id] + ' DE ' + ex.totalSeries + ' EN CURSO</div>';
      html += '<div id="timer_digits_' + ex.id + '" class="timer-digits">00 : 00</div></div>';
      html += '<button id="btn_finish_' + ex.id + '" class="btn-green" onclick="finishSerie(\'' + ex.id + '\', ' + ex.totalSeries + ', ' + j + ')">Finalizar Serie</button>';
      html += '<button style="background:#b91c1c; color:#fff; border:none; width:36px; height:36px; border-radius:8px; font-size:1.1rem; font-weight:bold;" onclick="cancelTimer(\'' + ex.id + '\')">✕</button>';
      html += '</div>';

      html += '<div id="video_box_' + ex.id + '" class="video-container" style="display:none;">';
      html += '<video id="video_el_' + ex.id + '" loop muted playsinline></video>';
      html += '</div>';

      html += '<div class="grid-inputs">';
      html += '<div><label>Peso (kg)</label><div class="counter">';
      html += '<button type="button" onclick="adjustVal(\'' + ex.id + '_weight\', -2.5)">-</button>';
      html += '<input type="number" step="0.5" id="' + ex.id + '_weight" value="' + (exData.weight !== undefined ? exData.weight : ex.defaultWeight) + '">';
      html += '<button type="button" onclick="adjustVal(\'' + ex.id + '_weight\', 2.5)">+</button>';
      html += '</div></div>';
      html += '<div><label>Reps / Series</label><input type="text" id="' + ex.id + '_reps" value="' + (exData.reps || ex.defaultReps) + '"></div>';
      html += '</div>';

      html += '<div style="margin-top:10px;"><label>Notas / Sensaciones</label><input type="text" id="' + ex.id + '_notes" value="' + (exData.notes || '') + '"></div>';
    } else {
      html += '<div style="margin-top:12px; text-align:center;">';
      html += '<button class="btn-green" style="width:100%; font-size:1.1rem;" onclick="startBikeTimer(\'' + ex.id + '\')">🚴 Iniciar Calentamiento / Bici</button>';
      html += '<div id="bike_timer_' + ex.id + '" class="timer-digits" style="margin-top:8px; display:none;">05 : 00</div>';
      html += '</div>';
    }

    card.innerHTML = html;
    container.appendChild(card);
  }
}

function startSerie(exId, totalSeries) {
  var card = document.getElementById('card_' + exId);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });

  document.getElementById('btn_start_' + exId).style.display = 'none';
  document.getElementById('timer_box_' + exId).style.display = 'flex';

  timerSeconds[exId] = 0;
  clearInterval(timerIntervals[exId]);
  
  timerIntervals[exId] = setInterval(function() {
    timerSeconds[exId]++;
    var m = Math.floor(timerSeconds[exId] / 60);
    var s = timerSeconds[exId] % 60;
    var digits = (m < 10 ? '0' + m : m) + ' : ' + (s < 10 ? '0' + s : s);
    var digitsEl = document.getElementById('timer_digits_' + exId);
    if (digitsEl) digitsEl.textContent = digits;
  }, 1000);
}

function finishSerie(exId, totalSeries, currentIndex) {
  clearInterval(timerIntervals[exId]);
  document.getElementById('timer_box_' + exId).style.display = 'none';

  if (currentSeries[exId] < totalSeries) {
    currentSeries[exId]++;
    var btnStart = document.getElementById('btn_start_' + exId);
    if (btnStart) {
      btnStart.textContent = '⏱ Iniciar Serie ' + currentSeries[exId] + '/' + totalSeries;
      btnStart.style.display = 'block';
    }
  } else {
    currentSeries[exId] = 1;
    saveData(false);

    var daySelect = document.getElementById('daySelect');
    var currentDay = daySelect ? daySelect.value : "1";
    var exercises = baseRoutines[currentDay];

    if (exercises && currentIndex + 1 < exercises.length) {
      var nextEx = exercises[currentIndex + 1];
      var nextCard = document.getElementById('card_' + nextEx.id);
      if (nextCard) {
        nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }
}

function cancelTimer(exId) {
  clearInterval(timerIntervals[exId]);
  document.getElementById('timer_box_' + exId).style.display = 'none';
  var btnStart = document.getElementById('btn_start_' + exId);
  if (btnStart) btnStart.style.display = 'block';
}

function startBikeTimer(exId) {
  var timerEl = document.getElementById('bike_timer_' + exId);
  if (!timerEl) return;
  timerEl.style.display = 'block';
  var sec = 300;
  clearInterval(timerIntervals[exId]);
  
  timerIntervals[exId] = setInterval(function() {
    sec--;
    if (sec <= 0) {
      clearInterval(timerIntervals[exId]);
      timerEl.textContent = "¡COMPLETADO!";
      try { navigator.vibrate([200, 100, 200]); } catch(e){}
      return;
    }
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    timerEl.textContent = (m < 10 ? '0' + m : m) + ' : ' + (s < 10 ? '0' + s : s);
  }, 1000);
}

function toggleVideo(exId) {
  var box = document.getElementById('video_box_' + exId);
  var btn = document.getElementById('btn_vid_' + exId);
  var videoEl = document.getElementById('video_el_' + exId);

  if (box.style.display === 'none') {
    box.style.display = 'block';
    btn.textContent = '✕ Ocultar Vídeo';
    if (videoEl && localVideos[exId]) {
      videoEl.src = localVideos[exId];
      videoEl.play();
    }
  } else {
    box.style.display = 'none';
    btn.textContent = '▶ Vídeo';
    if (videoEl) videoEl.pause();
  }
}

function adjustVal(inputId, amount) {
  var el = document.getElementById(inputId);
  if (!el) return;
  var val = parseFloat(el.value) || 0;
  el.value = Math.max(0, val + amount);
}

function saveData(showAlert) {
  var daySelect = document.getElementById('daySelect');
  var currentDay = daySelect ? daySelect.value : "";
  if (!currentDay) { 
    if(showAlert) alert("Por favor, selecciona primero una Rutina de Entreno."); 
    return false; 
  }

  var date = document.getElementById('sessionDate').value;
  var exercises = baseRoutines[currentDay] || [];
  var sessionData = {};

  for (var k = 0; k < exercises.length; k++) {
    var ex = exercises[k];
    if (ex.isBike || ex.isBikeOptional) continue;
    var weightEl = document.getElementById(ex.id + '_weight');
    var repsEl = document.getElementById(ex.id + '_reps');
    var notesEl = document.getElementById(ex.id + '_notes');
    sessionData[ex.id] = {
      weight: weightEl ? weightEl.value : '',
      reps: repsEl ? repsEl.value : '',
      notes: notesEl ? notesEl.value : '',
      name: ex.name,
      exId: ex.id
    };
  }

  var existingIdx = -1;
  for (var h = 0; h < appData.history.length; h++) {
    if (String(appData.history[h].day) === String(currentDay) && appData.history[h].date === date) {
      existingIdx = h;
      break;
    }
  }

  if (existingIdx !== -1) {
    appData.history[existingIdx].data = sessionData;
  } else {
    appData.history.push({ date: date, day: currentDay, data: sessionData });
  }

  localStorage.setItem('gym_routine_pro_data', JSON.stringify(appData));
  if(showAlert) alert("¡Sesión guardada con éxito!");
  return true;
}

function toggleModal(show) {
  var m = document.getElementById('historyModal');
  if (m) m.style.display = show ? 'flex' : 'none';
  if (show) {
    populateCompareDropdown();
    loadHistoryModal();
  }
}

function switchTab(tab) {
  document.getElementById('tabSessions').className = 'tab-btn' + (tab === 'sessions' ? ' active' : '');
  document.getElementById('tabExercise').className = 'tab-btn' + (tab === 'exercise' ? ' active' : '');
  document.getElementById('tabGlobal').className = 'tab-btn' + (tab === 'global' ? ' active' : '');
  
  document.getElementById('viewSessions').style.display = tab === 'sessions' ? 'block' : 'none';
  document.getElementById('viewExercise').style.display = tab === 'exercise' ? 'block' : 'none';
  document.getElementById('viewGlobal').style.display = tab === 'global' ? 'block' : 'none';
  
  if (tab === 'exercise') renderExerciseAnalysis();
  if (tab === 'global') renderGlobalAnalysis();
}

function populateCompareDropdown() {
  var select = document.getElementById('exerciseCompareSelect');
  if (!select) return;
  select.innerHTML = '';
  var days = Object.keys(baseRoutines);
  for (var d = 0; d < days.length; d++) {
    var day = days[d];
    var exList = baseRoutines[day];
    for (var e = 0; e < exList.length; e++) {
      var ex = exList[e];
      if (ex.isBike || ex.isBikeOptional) continue;
      var opt = document.createElement('option');
      opt.value = ex.id;
      opt.textContent = ex.name + ' (Día ' + day + ')';
      select.appendChild(opt);
    }
  }
}

function loadHistoryModal() {
  var container = document.getElementById('historyList');
  if (!container) return;
  container.innerHTML = '';
  if(!appData.history || appData.history.length === 0) {
    container.innerHTML = '<p style="font-size:14px; color:#a1a1aa; text-align:center;">No hay sesiones guardadas aún.</p>';
    return;
  }

  var reversed = appData.history.slice().reverse();
  for (var r = 0; r < reversed.length; r++) {
    var s = reversed[r];
    var item = document.createElement('div');
    item.style.cssText = 'background:#050201; padding:14px; border-radius:12px; border:1px solid #7c2d12; margin-bottom:12px; font-size:13px;';
    
    var exercisesHtml = '';
    var keys = Object.keys(s.data);
    for (var k = 0; k < keys.length; k++) {
      var d = s.data[keys[k]];
      if (d.weight) {
        exercisesHtml += '<div style="display:flex; justify-content:space-between; margin-bottom:6px; border-bottom:1px solid #1f0f04; padding-bottom:4px;">';
        exercisesHtml += '<span style="font-weight:600; color:#f8fafc;">' + d.name + '</span>';
        exercisesHtml += '<span style="color:#fd5e09; font-weight:bold;">' + d.weight + ' kg (' + (d.reps || 'reps N/A') + ')</span>';
        exercisesHtml += '</div>';
      }
    }

    item.innerHTML = '<div style="font-weight:bold; color:#f59e0b; font-size:14px; margin-bottom:10px;">📅 ' + s.date + ' - Día ' + s.day + '</div><div>' + exercisesHtml + '</div>';
    container.appendChild(item);
  }
}

window.addEventListener('DOMContentLoaded', function() {
  setTodayDate();
  
  var daySelect = document.getElementById('daySelect');
  if (daySelect) daySelect.addEventListener('change', renderExercises);
  
  var btnSaveBtn = document.getElementById('btnSaveBtn');
  if (btnSaveBtn) btnSaveBtn.addEventListener('click', function(){ saveData(true); });
  
  var btnHistoryBtn = document.getElementById('btnHistoryBtn');
  if (btnHistoryBtn) btnHistoryBtn.addEventListener('click', function(){ toggleModal(true); });
  
  var btnExitBtn = document.getElementById('btnExitBtn');
  if (btnExitBtn) btnExitBtn.addEventListener('click', function(){ saveData(false); alert("Sesión guardada automáticamente."); });
  
  var videoFolderInput = document.getElementById('videoFolderInput');
  if (videoFolderInput) {
    videoFolderInput.addEventListener('change', function(e) {
      var files = e.target.files;
      var loadedCount = 0;
      for (var i = 0; i < files.length; i++) {
        var file = files[i];
        if (file.type.startsWith('video/') || file.name.match(/\.(mp4|webm|mkv|mov)$/i)) {
          var fileName = file.name.toLowerCase();
          var days = Object.keys(baseRoutines);
          for (var d = 0; d < days.length; d++) {
            var list = baseRoutines[days[d]];
            for (var exIdx = 0; exIdx < list.length; exIdx++) {
              var ex = list[exIdx];
              var cleanName = ex.name.toLowerCase().replace(/[^a-z0-9]/g, '');
              if (fileName.indexOf(cleanName) !== -1 || fileName.indexOf(ex.id) !== -1) {
                localVideos[ex.id] = URL.createObjectURL(file);
                loadedCount++;
              }
            }
          }
        }
      }
      alert("¡Se vincularon " + loadedCount + " vídeos de tu carpeta local!");
      renderExercises();
    });
  }

  var btnCloseModal = document.getElementById('btnCloseModal');
  if (btnCloseModal) btnCloseModal.addEventListener('click', function(){ toggleModal(false); });
});
</script>
