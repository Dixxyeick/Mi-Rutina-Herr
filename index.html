<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a0c02">
<title>Rutina Herrero</title>
<link rel="icon" type="image/png" href="./icono.png">
<link rel="manifest" href="./manifest.json">
<style>
  body { 
    font-family: system-ui, -apple-system, sans-serif; 
    background-color: #0d0602; 
    color: #f8fafc; 
    margin: 0; 
    padding: 16px; 
    padding-bottom: 40px;
  }
  .card { 
    background: linear-gradient(145deg, rgba(31, 15, 4, 0.95), rgba(13, 6, 2, 0.95)); 
    padding: 16px; 
    border-radius: 14px; 
    margin-bottom: 14px; 
    border: 1.5px solid #7c2d12; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.8);
  }
  label { font-size: 12px; color: #f97316; display: block; margin-bottom: 6px; font-weight: 800; text-transform: uppercase; }
  select, input { background-color: #050201; color: #fff; border: 1.5px solid #7c2d12; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; font-size: 15px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn { background: linear-gradient(135deg, #ea580c, #7c2d12); color: white; border: 1.5px solid #fd5e09; padding: 14px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 16px; margin-top: 10px; }
  .btn-save { background: linear-gradient(135deg, #15803d, #14532d); border-color: #22c55e; }
</style>
</head>
<body>

<div class="card">
  <label>Día de Entreno</label>
  <select id="daySelect" onchange="renderRoutines()">
    <option value="">-- Seleccionar Día --</option>
    <option value="1">DÍA UNO - Hombro, Dorsal, Pectoral, Abs</option>
    <option value="2">DÍA DOS - Pierna, Femoral, Bíceps, Tríceps</option>
  </select>
</div>

<div id="exercisesContainer">
  <p style="text-align:center; color:#a1a1aa; padding:20px;">👆 Selecciona un día arriba para cargar la rutina.</p>
</div>

<button class="btn btn-save" onclick="saveSession()">💾 Guardar Sesión</button>

<script>
var routines = {
  "1": [
    { name: "1. Elevaciones laterales con mancuernas", target: "4 series x 12 rep." },
    { name: "2. Press militar sentado en máquina", target: "4 series x 12 rep." },
    { name: "3. Contractora inversa / Pájaro", target: "4 series x 12 rep." },
    { name: "4. Remo bajo sentado en polea", target: "4 series x 12 rep." },
    { name: "5. Jalón al pecho en máquina", target: "4 series x 12 rep." },
    { name: "6. Press inclinado en máquina", target: "4 series x 12 rep." },
    { name: "7. Plancha abdominal", target: "3 series x 20 seg." }
  ],
  "2": [
    { name: "1. Prensa de piernas sentado", target: "4 series x 12 rep." },
    { name: "2. Extensiones de cuádriceps", target: "4 series x 12 rep." },
    { name: "3. Femoral tumbado", target: "4 series x 12 rep." },
    { name: "4. Curl de bíceps con mancuernas", target: "4 series x 12 rep." },
    { name: "5. Extensión de tríceps en polea", target: "4 series x 12 rep." }
  ]
};

function renderRoutines() {
  var day = document.getElementById('daySelect').value;
  var container = document.getElementById('exercisesContainer');
  container.innerHTML = '';
  if (!day || !routines[day]) {
    container.innerHTML = '<p style="text-align:center; color:#a1a1aa; padding:20px;">👆 Selecciona un día arriba para cargar la rutina.</p>';
    return;
  }
  var list = routines[day];
  for (var i = 0; i < list.length; i++) {
    var item = list[i];
    var card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = 
      '<strong style="color:#fd5e09; font-size:16px;">' + item.name + '</strong>' +
      '<div style="color:#f59e0b; font-size:12px; margin-top:2px; margin-bottom:8px;">' + item.target + '</div>' +
      '<div class="grid">' +
        '<div><label>Peso (kg)</label><input type="number" placeholder="0"></div>' +
        '<div><label>Notas</label><input type="text" placeholder="Sensaciones"></div>' +
      '</div>';
    container.appendChild(card);
  }
}

function saveSession() {
  alert("¡Sesión registrada correctamente!");
}
</script>
</body>
</html>
